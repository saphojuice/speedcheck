[package]
name = "sj-probe"
version = "0.1.0"
edition = "2021"
description = "SAPHOJUICE machine probe: measures the physical constants that determine local LLM speed"
license = "MIT"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
