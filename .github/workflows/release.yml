name: release

# Builds the probe in public CI from the public source, so anyone can check that the binary
# they download matches the code in this repository. Pushing a v* tag publishes the binaries
# as release assets, with SHA256SUMS both as an asset (the install scripts fetch it) and in
# the release body (so a human can read it without downloading anything).
#
# Runner labels checked against GitHub's hosted-runner list on 21 September 2026.
# Note macos-13 is gone: Intel macOS is macos-15-intel now.

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # lets the matrix be exercised without cutting a release

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: sj-probe-linux-x64
            bin: sj-probe
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: sj-probe-windows-x64.exe
            bin: sj-probe.exe
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: sj-probe-windows-arm64.exe
            bin: sj-probe.exe
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            asset: sj-probe-macos-arm64
            bin: sj-probe
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: sj-probe-macos-x64
            bin: sj-probe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl keeps the Linux binary static, so it runs on any distro regardless of glibc
      # version. ring needs a C compiler for its assembly; musl-gcc is that compiler.
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        working-directory: speedcheck
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        working-directory: speedcheck
        shell: bash
        run: |
          # cross-built Intel macOS cannot run on the arm64 runner, and vice versa
          if [ "${{ matrix.name }}" = "macos-x64" ] && [ "$(uname -m)" = "arm64" ]; then
            echo "cross build, skipping run"; exit 0
          fi
          ./target/${{ matrix.target }}/release/${{ matrix.bin }} k --tokps 20 --model-gb 1.11 --bw 27

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "speedcheck/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: staged
          merge-multiple: true

      - name: Compute SHA256SUMS
        id: sums
        run: |
          cd staged
          ls -la
          sha256sum sj-probe-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            echo "One command. Nothing installs, nothing is left on the machine."
            echo
            echo '**macOS and Linux**'
            echo '```'
            echo 'curl -fsSL https://saphojuice.com/check | sh'
            echo '```'
            echo
            echo '**Windows** (PowerShell)'
            echo '```'
            echo 'irm https://saphojuice.com/check.ps1 | iex'
            echo '```'
            echo
            echo "The scripts download the binary for your platform, verify its SHA-256 against the list below, run it, and delete it."
            echo "Every binary here was built by GitHub Actions from the source in this repository, so the hashes are reproducible from public code."
            echo
            echo '## SHA256SUMS'
            echo '```'
            cat staged/SHA256SUMS
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            staged/sj-probe-* staged/SHA256SUMS
